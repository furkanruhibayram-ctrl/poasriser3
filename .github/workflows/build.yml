name: Build POASRISER

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target POASRISER_VST3 --parallel 4

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: POASRISER-${{ runner.os }}-VST3
          path: build/POASRISER_artefacts/**/VST3/**
          if-no-files-found: error
